name: Radar de Passagens

on:
  schedule:
    - cron: "0 11 * * *"   # todo dia às 11:00 UTC (08:00 em Brasília)
  workflow_dispatch:        # permite rodar na mão pela aba Actions

permissions:
  contents: write           # para commitar o site/dados.json

env:
  TZ: America/Sao_Paulo

concurrency:
  group: radar              # nunca duas execuções ao mesmo tempo (evita conflito de commit)
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # guarda o radar.db entre execuções (histórico + "o que já avisei")
      - uses: actions/cache@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Rodar testes
        run: |
          python -m pytest -q
          node --test tests/js/radar-core.test.js

      - name: Rodar o radar e atualizar o site
        env:
          RADAR_CONFIG_TOML: ${{ secrets.RADAR_CONFIG_TOML }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$RADAR_CONFIG_TOML" ]; then echo "$RADAR_CONFIG_TOML" > config.toml; else cp config.example.toml config.toml; fi
          python -m radar --exportar site/dados.json --historico site/historico.json

      - name: Publicar dados do site
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add site/dados.json site/historico.json
          git diff --staged --quiet || (git commit -m "Atualiza dados do site" && git push)
